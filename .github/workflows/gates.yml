name: Gates and deploy

# Everything that can be checked without a person looking at a screen.
#
# The privacy gate is here from this repository's FIRST workflow, per Doctrine
# §9b: a repository that waits to be caught by somebody running the script by
# hand is not gated. It runs the hub's CANONICAL copy rather than a fork, so a
# pattern widened in the hub binds here on the next push with no copy to drift.
#
# Nothing in this job pushes, and nothing in it needs a token, so the checkout
# leaves no credential in .git/config for whatever step gets added next year.

# `staging` and `main` only, deliberately. The harness's own `claude/*` branch is
# kept pointing at the same commit as `staging` so nothing is stranded on it —
# which means listing it here buys no coverage and costs a SECOND full run and a
# SECOND preview deploy of identical bytes on every push. Gates run where work
# lands and where it is promoted to.
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

env:
  # The hub commit this repository has reconciled with. Moved by
  # `doctrine-sync.mjs --adopt`, and this pin moves with it.
  HUB_SHA: 2181454773e702bc2437f338d6117916fdccc5cc

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The hub, at an untracked path, pinned by SHA. `.hub` is the name the
      # hub's own gates know to skip when they walk a sibling's tree.
      - name: Check the hub out for the shared gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: njefferson/noahjefferson
          ref: ${{ env.HUB_SHA }}
          path: .hub
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # ---- the engine's own checks ----

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: The release triplet is written once
        run: npm run version:check

      # ---- the doctrine gates ----
      #
      # AHEAD OF THE BROWSER WORK, deliberately. A step that fails stops the job,
      # so anything after it is skipped — and the first version of this file put
      # the privacy gate last, behind a browser install and two browser-driven
      # gates. A Chromium that would not download meant §9b's HARD gate silently
      # did not run. The order is now cheapest-and-most-important first.

      - name: The owner's person is not repo material
        run: node .hub/privacy-check.mjs --repo .

      - name: Every set-apart quotation says whose words it is
        run: node .hub/quote-check.mjs --repo .

      - name: No grids in anything the owner reads
        run: node .hub/docs-check.mjs .

      - name: npm hygiene
        run: node .hub/pin-check.mjs --repo .

      # --artefact, NOT the plain check. The plain check also asserts that
      # `.git/hooks/pre-commit` is installed, which is a fact about ONE CLONE,
      # and `actions/checkout` leaves `.git/hooks` empty by definition — so a
      # runner can never satisfy it and the step would fail on every push. What
      # a runner CAN check is that the tracked hook still matches what
      # `.branch-guard` declares, which is the drift that matters. Never
      # `--install` here instead: that WRITES the tracked file and repairs the
      # one defect the step exists to find. (Hub LESSONS 107.)
      - name: The branch guard has not drifted from what it declares
        run: node .hub/branch-guard.mjs --repo . --artefact

      - name: The palette clears every hard floor
        run: node .hub/palette-check.mjs palettes/molebridge.json

      - name: Install zizmor (version- and hash-pinned by the hub)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --only-binary=:all: \
            --require-hashes -r .hub/.github/requirements-ci.txt

      # --strict-collection is not optional. Without it an unparseable workflow
      # is logged, skipped, and the audit still exits 0 with "No findings" — the
      # file most likely to be wrong is the one excused.
      - name: Workflow security audit
        run: |
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --strict-collection \
            .github/workflows/

      # ---- the browser gates ----
      #
      # The BROWSER COMES FIRST, before the build. `npm run build` renders the
      # icon PNGs by driving a real browser, so a build with no Chromium fails
      # at the icons — which is exactly what happened when the install step sat
      # after it.
      #
      # The session sandbox ships a Chromium at a fixed path and `serve.mjs`
      # finds it; a runner has none, so playwright downloads its own and the
      # tools fall through to it.
      - name: Install a browser for the build and the gates
        run: npx playwright-core install --with-deps chromium

      - name: Build the browser bundle
        run: npm run build

      # Doctrine §6: walk the primary journey from the start screen. It gets one
      # step wrong on purpose, and it drops the network to prove the offline
      # claim rather than asserting it.
      - name: The primary journey
        run: node tools/walk.mjs

      # Doctrine §4, and it exits non-zero. Every state, both themes, measured
      # from the pixels the browser resolved rather than from the declarations.
      - name: Accessibility
        run: node tools/a11y.mjs

      # THE GATED BYTES, handed to the deploy job. Rebuilding there would deploy
      # a build nothing had checked — near-identical, and near-identical is the
      # word that does the damage. What passed the walk and the accessibility
      # gate is what goes out.
      - name: Keep the build that passed
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: public/
          retention-days: 7
          include-hidden-files: true

  deploy:
    name: Deploy
    # Only after every gate above has passed. A step that fails stops its job,
    # so `needs` here means the build being deployed cleared all of them.
    needs: gates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # A DEDICATED ENVIRONMENT, and two of them, which is Doctrine §16.5:
    # friction in proportion to damage. Production and preview being the same
    # environment would mean any protection rule put on production also gates
    # every preview, so nobody would put one on. Split, a required reviewer can
    # sit on `production` alone — which is the difference between a deploy to a
    # class's address and a deploy to a throwaway URL.
    #
    # zizmor's `secrets-outside-env` is what asked for this. It is suppressed at
    # the default threshold, so it was found by running the auditor persona on a
    # workflow that had just been handed a live Cloudflare token, rather than by
    # reading the green tick.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: public

      - name: What is being deployed
        run: |
          echo "branch: $GITHUB_REF_NAME"
          echo "commit: $GITHUB_SHA"
          find public -type f | sort | head -40
          echo "$(find public -type f | wc -l) files"

      - name: Prepare Cloudflare credentials
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Strip whitespace and newlines that come along when a secret is
          # pasted. A trailing newline corrupts the Authorization header and
          # Cloudflare answers 6111, which reads like a bad token and is not.
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not set on this repository — nothing to deploy to."
          fi
          # Doctrine §16.4: the cleaned values go to the job ENVIRONMENT, never
          # to step outputs. Outputs persist in the run's stored output and are
          # readable through the API; env is scoped to this job. Only the
          # non-secret `ready` flag is an output.
          echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Verify the token before using it
        if: steps.cf.outputs.ready == 'true'
        continue-on-error: true
        run: |
          curl -s https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('token valid:', d.get('success'), '| status:', (d.get('result') or {}).get('status'), '| errors:', d.get('errors'))"

      # Idempotent: it fails harmlessly once the project exists, which is why it
      # tolerates its own failure rather than being a thing somebody has to
      # remember to do by hand exactly once.
      - name: Ensure the Pages project exists
        if: steps.cf.outputs.ready == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          command: pages project create molebridge --production-branch=main

      # `main` is the production branch, so every other branch lands as a
      # PREVIEW on its own URL. That is what makes the pipeline verifiable
      # without putting unreviewed work on the address a class would use.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          command: pages deploy public --project-name=molebridge --branch=${{ github.ref_name }} --commit-dirty=true

      - name: How to roll this back
        if: always() && steps.cf.outputs.ready == 'true'
        run: |
          # Printed on every deploy so the rollback path is known BEFORE it is
          # needed rather than looked up during a lesson.
          echo "If this deploy is bad:"
          echo "  Cloudflare dashboard -> Workers & Pages -> molebridge -> Deployments"
          echo "  -> pick the last good one -> Manage deployment -> Rollback."
          echo "That is instant. A git revert also works but waits for a fresh build,"
          echo "and concurrency cancel-in-progress can cancel an in-flight deploy."

      # Doctrine §16.6/§16.8: headers are checked by FETCHING THE DEPLOYED PAGE.
      # Nothing else proves them — `_headers` uploading only means the file
      # arrived, not that the edge applied it, and the difference is invisible
      # from the repository. The session sandbox cannot make this request (its
      # proxy denies *.pages.dev at CONNECT), so the runner does it, which is
      # the difference between a manual step handed over and a gate.
      - name: The deployed page answers, with its headers
        if: steps.cf.outputs.ready == 'true'
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "deployed to: $DEPLOYED_URL"

          # Cloudflare needs a moment between "deployment complete" and the edge
          # serving it. Retry rather than sleep-and-hope.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$DEPLOYED_URL/" || echo 000)
            [ "$code" = "200" ] && break
            echo "  attempt $attempt: $code, waiting"
            sleep 5
          done
          [ "$code" = "200" ] || { echo "FAIL the deployed page answered $code"; exit 1; }

          headers=$(curl -sS -D - -o /dev/null --max-time 20 "$DEPLOYED_URL/" | tr 'A-Z' 'a-z')
          fail=0
          for required in \
            'x-content-type-options: nosniff' \
            'referrer-policy:' \
            'x-frame-options: deny' \
            'cross-origin-opener-policy: same-origin' \
            'permissions-policy:'
          do
            if printf '%s' "$headers" | grep -q "$required"; then
              echo "  ok    $required"
            else
              echo "  FAIL  $required is missing from the deployed page"
              fail=1
            fi
          done

          # The worker must never come from a cache older than itself, or a new
          # release cannot arrive at all.
          sw=$(curl -sS -D - -o /dev/null --max-time 20 "$DEPLOYED_URL/sw.js" | tr 'A-Z' 'a-z')
          if printf '%s' "$sw" | grep -q 'cache-control:.*no-cache'; then
            echo "  ok    sw.js is served no-cache"
          else
            echo "  FAIL  sw.js is not served no-cache — a new release could never arrive"
            fail=1
          fi

          # And it is really the app, not a holding page.
          body=$(curl -sS --max-time 20 "$DEPLOYED_URL/")
          printf '%s' "$body" | grep -q '/app/ui/app.js' \
            && echo "  ok    the page loads the app" \
            || { echo "  FAIL  the deployed page is not MoleBridge"; fail=1; }

          exit $fail
