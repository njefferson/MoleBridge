<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MoleBridge — social preview</title>
<!--
  The SOURCE of the social preview card. `tools/render-og.mjs` drives a real
  browser over this file and writes og.png at 1280x640, which is what GitHub
  asks for.

  Doctrine §3: the artwork is wordless and the lettering is REAL TYPE laid over
  it, never drawn into the drawing. That is why this is HTML rather than an SVG
  with paths for letters — a path cannot be re-set at another size, cannot be
  read by anything, and goes wrong the first time a word changes.

  Every colour here is a token from palettes/molebridge.json, taken rather than
  picked, and the renderer MEASURES the contrast of each piece of text against
  what is actually behind it. A card is looked at more than it is read, which is
  exactly why nobody notices it failing.
-->
<style>
  :root {
    --page: #1a1a1a;
    --page-alt: #232323;
    --surface: #3a3a3a;
    --hairline: rgba(255, 255, 255, 0.17);
    --text-1: #eaeaea;
    --text-3: #c1c1c1;
    --accent: #9fd8b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; }
  body {
    background:
      radial-gradient(900px 620px at 88% 116%, rgba(159, 216, 176, 0.14) 0%, rgba(159, 216, 176, 0) 68%),
      linear-gradient(180deg, var(--page-alt), var(--page));
    color: var(--text-1);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 88px;
    overflow: hidden;
  }
  .words { flex: 1 1 auto; min-width: 0; }

  /* The REAL app icon, whole and uncropped — the tile a student ends up with on
     a home screen, so the repository page and the installed thing are visibly
     the same object.

     An earlier version put a huge ghost of the glyph bleeding off the corner
     instead. Cropped, the arc and its centre post closed into a circle with a
     stem and read as a peace symbol. A decorative shape is not decorative if it
     resolves into some other symbol; there is no way to measure that, so the
     rule is simply that the glyph appears once and appears whole. */
  .mark { flex: 0 0 auto; width: 264px; height: 264px; }

  h1 {
    font-size: 84px;
    font-weight: 650;
    letter-spacing: -0.025em;
    line-height: 1;
  }

  .rule {
    width: 148px;
    height: 6px;
    border-radius: 6px;
    margin: 28px 0 26px;
    background: var(--accent);
  }

  .tag {
    font-size: 33px;
    line-height: 1.3;
    color: var(--text-3);
  }

  /* ONE ROW, and nowrap rather than wrap. A wrapped chip row on a card reads as
     a layout that ran out of space, and `flex-wrap: wrap` hides that by
     succeeding quietly — the renderer asserts the row fits instead. */
  .chips { display: flex; flex-wrap: nowrap; gap: 13px; margin-top: 42px; }
  .chip {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
    color: var(--text-1);
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 12px 22px;
  }

</style>
</head>
<body>
  <div class="words">
    <h1>MoleBridge</h1>
    <div class="rule"></div>
    <p class="tag">A stoichiometry trainer that names the mistake, not just the answer.</p>

    <div class="chips">
      <span class="chip">six gated steps</span>
      <span class="chip">works offline</span>
      <span class="chip">no student data</span>
    </div>
  </div>

  <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
  <!--
    A mole crossing a bridge, left to right. Wordless by design (Doctrine §3):
    lettering is overlaid afterwards in real type where it is needed, never
    drawn into the artwork.

    THREE THINGS THIS DRAWING HAS ALREADY BEEN WRONG ABOUT, in order, because
    each was invisible in the source and obvious the moment it was rendered:

    1. It read as a FROWNING FACE — three particles above an arch inside a
       rounded square became two eyes, a brow and a downturned mouth, worst at
       16 and 32 pixels. Rearranging the particles made it worse twice. Small
       shapes above a curve inside a rounded square IS a face schema, so the row
       of shapes had to go rather than move.

    2. It did not read as an ANIMAL — no leg separation, a snout that was a bump
       rather than a point, the shovel paw buried inside the body outline. What
       fixed it was silhouette rather than detail: the nose projects past
       everything else, the back humps, the tail is clear of the body.

    3. It grew a FIFTH LEG. The foreleg was a separate shape with its own
       outline, laid over the body, and it read as a limb sprouting from the
       shoulder — with two hind feet already drawn, the animal had three legs
       and a tail.

    So the body is now ONE CLOSED PATH and the legs are cut INTO its underside:
    back, head, snout, under the chin, down the foreleg, across the spade foot,
    up, along the belly, down the hind leg, across its foot, and home. A leg
    that is part of the outline cannot detach from it. Two legs, which is what a
    side profile shows.

    THE TILE-COLOURED OUTLINE IS LOAD-BEARING. Without it the white animal and
    the white arch merge into one shape the moment they touch, and the mole
    stops being an object standing on something.

    At 16 pixels this is a bump on an arch. That is what favicon.svg is for.
  -->
  <rect width="512" height="512" rx="112" fill="#14532d"/>
  <g fill="none" stroke="#eef3fb" stroke-width="38" stroke-linecap="round">
    <path d="M44 440 Q256 322 468 440"/>
  </g>
  <g transform="translate(65.1 137.1) scale(0.74)">
    <g fill="none" stroke="#14532d" stroke-width="17" stroke-linejoin="round">
      <path d="M144 252 C140 214 172 186 214 182 C252 178 292 188 316 204 C324 210 328 214 334 219 C354 227 384 234 412 242 C420 244 420 251 412 254 C388 261 362 266 344 271 L342 292 C354 292 366 296 370 302 C373 307 369 311 362 311 L316 311 C308 311 304 306 305 299 L307 285 C288 289 268 291 248 292 L244 296 C243 302 241 307 238 311 L200 311 C193 311 190 305 194 300 C198 294 202 291 206 289 L204 282 C168 277 147 268 144 252 Z"/>
      <path d="M146 250 C136 244 124 234 116 224 C111 218 117 210 124 214 C136 221 148 232 156 242 C160 247 154 254 146 250 Z"/>
    </g>
    <g fill="#eef3fb">
      <path d="M144 252 C140 214 172 186 214 182 C252 178 292 188 316 204 C324 210 328 214 334 219 C354 227 384 234 412 242 C420 244 420 251 412 254 C388 261 362 266 344 271 L342 292 C354 292 366 296 370 302 C373 307 369 311 362 311 L316 311 C308 311 304 306 305 299 L307 285 C288 289 268 291 248 292 L244 296 C243 302 241 307 238 311 L200 311 C193 311 190 305 194 300 C198 294 202 291 206 289 L204 282 C168 277 147 268 144 252 Z"/>
      <path d="M146 250 C136 244 124 234 116 224 C111 218 117 210 124 214 C136 221 148 232 156 242 C160 247 154 254 146 250 Z"/>
    </g>
    <circle cx="360" cy="240" r="7" fill="#14532d"/>
  </g>
</svg>
</body>
</html>
