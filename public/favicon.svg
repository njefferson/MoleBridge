<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MoleBridge">
  <!--
    THE TAB ICON, and deliberately not the same drawing as icon.svg.

    A browser tab renders this at 16 pixels. The mole on the app icon is a
    readable animal at 96 and a blob at 16, and one drawing cannot be both — the
    original mistake in this repository was letting the 16-pixel constraint
    flatten the app icon until it had no bridge left in it, only a suggestion of
    one. Two files cost one extra request, which is precached, and buy all the
    detail the tile can carry.

    So this is the span alone, at the fewest strokes that still say arch.
  -->
  <rect width="512" height="512" rx="112" fill="#14532d"/>
  <g fill="none" stroke="#eef3fb" stroke-width="44" stroke-linecap="round">
    <path d="M56 396 Q256 176 456 396"/>
    <path d="M172 396 Q256 300 340 396"/>
  </g>
</svg>
