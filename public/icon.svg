<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MoleBridge">
  <!--
    A mole crossing a bridge, left to right. Wordless by design (Doctrine §3):
    lettering is overlaid afterwards in real type where it is needed, never
    drawn into the artwork.

    THE PREVIOUS ICON READ AS A FROWNING FACE and shipped that way for three
    releases. Three particles above an arch inside a rounded square became two
    eyes, a brow and a downturned mouth, and it was worst at 16 and 32 pixels.
    Rearranging the particles made it worse twice — a diagonal produced a wink,
    a deck produced a grin. The rule turned out to be the composition rather
    than the arrangement: small shapes above a curve inside a rounded square IS
    a face schema, so the row of shapes had to go rather than move.

    What replaces it has ONE subject and no floating shapes. The animal's
    knockout details are the tile colour, so they read as openings rather than
    as a second palette.

    At 16 pixels this becomes an arch with a bump on it. That is what
    favicon.svg is for — see the note in its own file.
  -->
  <rect width="512" height="512" rx="112" fill="#14532d"/>
  <g fill="none" stroke="#eef3fb" stroke-width="38" stroke-linecap="round">
    <path d="M44 440 Q256 322 468 440"/>
  </g>
  <g transform="translate(59.2 146.0) scale(0.74)">
